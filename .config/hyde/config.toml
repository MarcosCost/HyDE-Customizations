# Configuration file for HyDE
# Environment variables should be on top
# Updated config.toml file can be found at $HOME/.local/share/hyde/config.toml
"$schema" = "https://raw.githubusercontent.com/HyDE-Project/HyDE/refs/heads/master/Configs/.local/share/hyde/schema/config.toml.json" #for autocompletion if I run this in an IDE


[screenshot]
annotation_tool = "satty-dynamic"


[battery.notify]
dock = false

[battery.notify.threshold]
low = 20
critical = 10
