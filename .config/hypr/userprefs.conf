#  Uncomment to enable // change to a preferred value
# 🔗 See https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = pt
    # follow_mouse = 1
    # sensitivity = 0
    # force_no_accel = 0
    # accel_profile = flat
    # numlock_by_default = true

    # 🔗 See https://wiki.hypr.land/Configuring/Variables/#touchpad
    touchpad {
        natural_scroll = yes
    }

}



# 🔗 See https://wiki .hyprland.org/Configuring/Variables/#gestures
gestures {
#     workspace_swipe = true
#     workspace_swipe_fingers = 3
}

# for window shallow similar to devour
misc {
    # enable_swallow = true
    # swallow_regex = (foot|kitty|allacritty|Alacritty|ghostty|Ghostty|org.wezfurlong.wezterm)
}

# Don't show update on first launch
ecosystem {
  # no_update_news = true
}


# // █▄▀ █▀▀ █▄█ █▄▄ █ █▄░█ █▀▄ █▀
# // █░█ ██▄ ░█░ █▄█ █ █░▀█ █▄▀ ▄█
# 🔗 See https://wiki.hypr.land/Configuring/Binds/

$mainMod = SUPER

# Screneshots
unbind = $mainMod, P
unbind = $mainMod Control, P
unbind = $mainMod Alt, P
unbind = , Print

$d=[Utilities|Screen Capture]
bindd = , Print, $d snip screen , exec, hyde-shell screenshot s # partial screenshot capture
bindd = $mainMod, Print, $d print monitor , exec, hyde-shell screenshot m # monitor screenshot capture
bindd = $mainMod Shift, Print, $d print all monitors , exec, hyde-shell screenshot p # all monitors screenshot capture
bindd = $mainMod Control, Print, $d freeze and snip screen, exec, hyde-shell screenshot sf # partial screenshot capture (frozen screen)

